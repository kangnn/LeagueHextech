<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>LeagueHextech</title>
<style>
  :root {
    color-scheme: dark;
    /* Cool near-black base with cyan for anything actionable and hextech gold reserved for the thing
       you actually care about - the room you are sitting in. Every surface reads from these variables,
       so re-theming means editing this block and nothing else. */
    --bg: #101014;
    --panel: #18181c;
    --surface: #1e1e22;
    --surface-2: rgba(255, 255, 255, .06);
    --line: rgba(255, 255, 255, .09);
    --line-strong: rgba(255, 255, 255, .16);
    --text: rgba(255, 255, 255, .88);
    --text-body: rgba(255, 255, 255, .80);
    --muted: rgba(255, 255, 255, .58);
    --dim: rgba(255, 255, 255, .38);
    --accent: #4cc2e0;
    --accent-dim: rgba(76, 194, 224, .16);
    --accent-line: rgba(76, 194, 224, .6);
    --gold: #c8aa6e;
    --ok: #5fd08a;
    --ok-dim: rgba(95, 208, 138, .14);
    --warn: #f0b849;
    --warn-dim: rgba(240, 184, 73, .14);
    --bad: #e8736a;
    --bad-dim: rgba(232, 115, 106, .14);
    --mute-dim: rgba(255, 255, 255, .07);
    /* Notice fills are the kind tints pre-composited onto the surface, i.e. opaque. The stack folds
       rows on top of each other, and a translucent fill would let the covered rows' text bleed
       through the front card - the fold reads as a smear of overlapping sentences. */
    --toast-info-bg: color-mix(in srgb, var(--accent) 16%, var(--surface));
    --toast-ok-bg: color-mix(in srgb, var(--ok) 14%, var(--surface));
    --toast-bad-bg: color-mix(in srgb, var(--bad) 14%, var(--surface));
  }
  * { box-sizing: border-box; }
  /* Explicit scrollbars: the default Chromium bar is far heavier than this UI. */
  * { scrollbar-width: thin; scrollbar-color: #40454d transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #40454d; border-radius: 2px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #565c66; background-clip: content-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  /* The log gets its own right-hand column so it is always visible without scrolling the page. */
  .app { display: grid; grid-template-columns: minmax(430px, 1fr) minmax(360px, .9fr); height: 100vh; min-height: 0; overflow: hidden; }
  main { padding: 18px 22px 24px; overflow-y: auto; min-height: 0; }
  /* The log column must never grow to fit its content: without the min-height guards a grid item keeps
     its automatic minimum size, the panel stretches to every line it ever logged, and the whole window
     starts scrolling. */
  aside { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; border-left: 1px solid var(--line-strong); background: var(--panel); }

  /* ---------- header ---------- */
  .titlebar { display: flex; align-items: center; gap: 4px; height: 38px; padding: 0 6px 0 14px; background: var(--surface); border-bottom: 1px solid var(--accent-line); -webkit-app-region: drag; user-select: none; }
  .titlebar button, .tb-version { -webkit-app-region: no-drag; }
  .tb-icon { width: 16px; height: 16px; margin-right: 8px; }
  .tb-title { font-weight: 600; font-size: 13px; letter-spacing: .3px; color: var(--text-body); }
  .tb-spacer { flex: 1; }
  .tb-version { font-size: 12px; color: var(--muted); margin-right: 6px; }
  .tb-sep { width: 1px; height: 16px; background: var(--line-strong); margin: 0 6px; }
  .tool { width: 30px; height: 26px; padding: 0; font-size: 14px; line-height: 1; background: transparent; border: none; color: var(--muted); font-weight: 400; }
  .tool:hover { color: var(--text-body); background: var(--surface-2); }
  /* Toolbar buttons are glyphs, not words, so they cannot swap their label for a verb phrase without
     the button lurching in width. Instead each glyph moves the way its own meaning suggests:
       ⟳ is a cycle arrow, so rotating it reads as "it is running again";
       ⇩ is a download arrow, so rotating it would throw the direction away and turn it into a
         generic spinner. It dips downward instead - the direction is the whole point of the icon. */
  .tool.working { opacity: 1; }
  .tool[data-busy="spin"].working .glyph { display: inline-block; animation: icon-spin .8s linear infinite; }
  .tool[data-busy="dip"].working .glyph { display: inline-block; animation: icon-dip 1s ease-in-out infinite; }
  @keyframes icon-spin { to { transform: rotate(360deg); } }
  @keyframes icon-dip {
    0%, 100% { transform: translateY(-1.5px); opacity: .5; }
    50%      { transform: translateY(1.5px);  opacity: 1; }
  }
  .wbtn { width: 40px; height: 26px; padding: 0; background: transparent; border: none; color: var(--muted); font-size: 12px; }
  .wbtn:hover { background: var(--surface-2); color: var(--text-body); }
  .wbtn.wclose:hover { background: #e81123; color: #fff; }
  .state-row { display: flex; align-items: center; gap: 14px; }
  .top { display: flex; align-items: center; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  h1::after { content: ""; display: block; width: 42px; height: 2px; margin-top: 7px; border-radius: 1px; background: linear-gradient(90deg, var(--gold), rgba(200, 170, 110, 0)); }
  h1 .cn { margin-left: 9px; font-size: 13px; font-weight: 400; color: var(--muted); }
  h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  h1::after { content: ""; display: block; width: 42px; height: 2px; margin-top: 7px; border-radius: 1px; background: linear-gradient(90deg, var(--gold), rgba(200, 170, 110, 0)); }
  .pill { position: relative; display: inline-flex; align-items: center; gap: 7px; flex: none; padding: 5px 11px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-2); font-size: 12.5px; color: var(--muted); white-space: nowrap; transition: color .18s, border-color .18s; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; transition: background .18s, box-shadow .18s; }
  .pill.flash { animation: flash-ring .6s ease-out; }
  @keyframes flash-ring { from { box-shadow: 0 0 0 0 var(--accent-dim); } to { box-shadow: 0 0 0 9px transparent; } }
  .pill[data-state="on"] { color: var(--ok); border-color: rgba(95, 208, 138, .35); }
  .pill[data-state="on"] .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-dim); }
  .pill[data-state="off"] { color: var(--bad); border-color: rgba(232, 115, 106, .35); }
  .pill[data-state="off"] .dot { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-dim); }
  .pill[data-state="warn"] { color: var(--warn); border-color: rgba(240, 184, 73, .35); }
  .pill[data-state="warn"] .dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-dim); }
  .pill[data-state="busy"] .dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  /* Kept last on purpose: it has to beat every [data-state] colour above, so a re-check does not sit
     there pulsing the previous verdict's red or green while it is deciding. */
  .pill.probing { color: var(--muted); border-color: var(--line-strong); }
  .pill.probing .dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); animation: probe-pulse .9s ease-in-out infinite; }
  @keyframes probe-pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

  /* ---------- state + actions ---------- */
  #state { font-size: 20px; font-weight: 600; margin: 16px 0 12px; display: flex; align-items: center; gap: 9px; }
  #state::before { content: ""; width: 4px; height: 20px; border-radius: 2px; background: var(--dim); }
  #state[data-state="joined"] { color: var(--ok); }
  #state[data-state="joined"]::before { background: var(--ok); }
  #state[data-state="joining"], #state[data-state="verifying"] { color: var(--warn); }
  #state[data-state="joining"]::before, #state[data-state="verifying"]::before { background: var(--warn); }
  #state[data-state="searching"], #state[data-state="connecting"] { color: var(--accent); }
  #state[data-state="searching"]::before, #state[data-state="connecting"]::before { background: var(--accent); }
  #state[data-state="idle"], #state[data-state="stopped"], #state[data-state="left"] { color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button { padding: 8px 15px; border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-contrast); cursor: pointer; font: inherit; font-size: 13.5px; font-weight: 600; }
  button:hover:not(:disabled) { background: #63cde8; }
  button.secondary { background: var(--surface-2); color: var(--text-body); font-weight: 400; }
  button.secondary:hover:not(:disabled) { background: rgba(255, 255, 255, .11); }
  button.ghost { background: transparent; border: 1px solid var(--line-strong); color: var(--muted); font-weight: 400; }
  button.ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  /* A button that is working says so on itself: the label swaps for the verb phrase and a spinner
     rides at the front. Nothing appears at the top of the window for a click that answers in a
     couple of hundred milliseconds - the notice layer is reserved for genuinely slow work. */
  button.working, button.working:disabled { opacity: 1; cursor: progress; }
  button.working.busy-loud { opacity: .82; }
  button .spin { flex: none; width: 11px; height: 11px; margin-right: 7px; border-radius: 50%; vertical-align: -1px; display: inline-block; border: 1.6px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; opacity: .9; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- stat tiles ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 16px 0 12px; }
  .stat { background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 8px 11px; min-width: 0; }
  .stat .k { display: block; color: var(--muted); font-size: 11.5px; }
  .stat .v { display: block; color: var(--text); font-size: 14px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- chips (rooms, counts, invites) ---------- */
  .chips { display: inline-flex; flex-wrap: wrap; gap: 4px; vertical-align: baseline; }
  .chip { font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; font-size: 11.5px; line-height: 1.7; padding: 0 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.room { color: #dcc48d; border-color: rgba(200, 170, 110, .30); background: rgba(200, 170, 110, .10); }
  .chip.count { color: var(--text-body); }
  .chip.invite { color: var(--warn); }
  .chip.spectate { color: var(--dim); }
  .chip.floor { color: var(--warn); border-color: rgba(240, 184, 73, .30); }
  .chip.deadline { color: var(--dim); }
  .row { display: flex; align-items: baseline; gap: 8px; margin: 0 0 6px; font-size: 12.5px; color: var(--muted); min-width: 0; }
  /* The rows above set display:flex, which would beat the hidden attribute without this. */
  [hidden] { display: none !important; }
  .row > .k { flex: none; }
  .error-row { color: var(--bad); }
  .error-row .v { color: var(--bad); word-break: break-word; }
  .diag { color: var(--muted); font-size: 12px; margin: 8px 0 0; word-break: break-word; }

  /* ---------- settings ---------- */
  .panel { border: 1px solid var(--line-strong); border-radius: 7px; margin: 4px 0 0; background: var(--mute-dim); }
  .panel-head { display: flex; align-items: baseline; gap: 10px; padding: 10px 13px 0; }
  .panel-head h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-body); }
  .panel-head .now { color: var(--dim); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: 9px 16px; padding: 2px 13px 13px; }
  .grid label { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; }
  .grid label .k { display: inline-flex; align-items: center; gap: 5px; }
  /* A visible "?" instead of a tooltip hidden on the input: the explanation is only useful if the user
     can see that there is one. The tooltip itself is the native one, which cannot be clipped by the
     scrolling settings panel the way a CSS popup would be. */
  .help { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line-strong); color: var(--dim); font-size: 10px; line-height: 1; cursor: help; user-select: none; }
  .help:hover { color: var(--text); border-color: var(--muted); background: var(--surface-2); }
  .grid input, .grid select { padding: 5px 7px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface-2); color: var(--text); font: inherit; font-size: 12.5px; min-width: 0; }
  .grid input:focus, .grid select:focus { border-color: var(--accent); outline: none; }
  .grid input { width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
  .grid input[type="text"] { flex: 1; width: auto; text-align: left; }
  .grid select { width: 100%; }
  .grid .wide { grid-column: 1 / -1; }
  .grid .save-row { grid-column: 1 / -1; display: flex; justify-content: flex-end; }

  /* ---------- log ---------- */
  .log-head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 9px; }
  .log-head h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-body); }
  .log-head .spacer { flex: 1; }
  /* One aggregate line over the feed: a search produces hundreds of lines, and "how many rooms did it
     actually try, and how many did it get into" is the question the feed cannot answer at a glance. */
  .log-stats { display: flex; flex-wrap: wrap; gap: 3px 13px; padding: 0 14px 9px; font-size: 12px; color: var(--muted); }
  .log-stats .n { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .log-stats .a .n { color: var(--accent); }
  .log-stats .o .n { color: var(--ok); }
  .log-stats .w .n { color: var(--warn); }
  .log-stats .b .n { color: var(--bad); }
  #logCount { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #clearLog { padding: 3px 10px; margin: 0; font-size: 12px; background: var(--surface-2); color: var(--muted); font-weight: 400; }
  #clearLog:hover { color: var(--text); }
  #log { flex: 1 1 0; min-height: 0; margin: 0 10px 12px; padding: 6px 4px 8px 6px; overflow-y: auto; overflow-x: hidden; background: var(--mute-dim); border: 1px solid var(--line); border-radius: 7px; font-size: 13px; }
  .line { padding: 3px 8px 3px 7px; border-left: 2px solid transparent; border-radius: 3px; overflow-wrap: anywhere; }
  .line + .line { margin-top: 1px; }
  .line:hover { background: var(--mute-dim); }
  .line .t { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--dim); }
  .line .tag { font-size: 12px; padding: 0 6px; border-radius: 4px; margin-left: 7px; white-space: nowrap; }
  .line .msg { margin-left: 7px; color: var(--text-body); }
  .line .x { margin-left: 6px; color: var(--muted); font-size: 11.5px; }
  .line .chips { margin-left: 7px; }
  .line[data-tone="accent"] { border-left-color: var(--accent-line); }
  .line[data-tone="accent"] .tag { color: var(--accent); background: var(--accent-dim); }
  .line[data-tone="info"] { border-left-color: var(--line-strong); }
  .line[data-tone="info"] .tag { color: var(--text-body); background: var(--mute-dim); }
  .line[data-tone="ok"] { border-left-color: rgba(95, 208, 138, .6); }
  .line[data-tone="ok"] .tag { color: var(--ok); background: var(--ok-dim); }
  .line[data-tone="warn"] { border-left-color: rgba(240, 184, 73, .55); }
  .line[data-tone="warn"] .tag { color: var(--warn); background: var(--warn-dim); }
  .line[data-tone="bad"] { border-left-color: rgba(232, 115, 106, .65); }
  .line[data-tone="bad"] .tag { color: var(--bad); background: var(--bad-dim); }
  .line[data-tone="bad"] .msg { color: #f2b3ad; }
  .line[data-tone="muted"] { border-left-color: var(--line); }
  .line[data-tone="muted"] .tag { color: var(--muted); background: var(--mute-dim); }
  .line[data-tone="muted"] .msg { color: var(--muted); }
  /* Notices drop in as banners at the top centre of the window (the CC Switch layout) and stack
     downward. Newest on top, older ones scroll behind: a burst of the same message reads as one
     banner with a count instead of a pile of rows. */
  /* Notices are banners at the top centre of the window, styled after the sonner conventions that
     CC Switch uses: 16px of padding, an 8px radius, a light shadow, an inline icon and a quiet
     0.4s slide. No progress bar and no counter - a notice is a sentence that appears and leaves.
     Cleared of the 38px titlebar so it cannot sit on the window buttons and eat their clicks. */
  #toasts { position: fixed; top: 46px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; z-index: 90; width: max-content; max-width: min(420px, calc(100vw - 40px)); pointer-events: none; }
  /* Coloured card, not a dark panel with a stripe down the side: the whole row is tinted by kind and
     the text carries the same hue, which is what CC Switch shows on screen. The row wraps instead of
     truncating - a failure that ends in "..." has hidden the one sentence the user needed (-:
     that is the opposite of a notice. The icon stays top-aligned so a wrapped row does not float it. */
  .toast { position: relative; display: flex; align-items: flex-start; gap: 8px; width: max-content; max-width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; color: var(--text); padding: 12px 16px; font-size: 14px; line-height: 1.5; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .3), 0 4px 6px -4px rgba(0, 0, 0, .3); animation: toast-in .4s cubic-bezier(.22, 1, .36, 1); pointer-events: auto; cursor: default; transition: margin-top .25s ease; }
  /* CC Switch stacks its notices like a deck: every row but the newest slides up behind the one in
     front and only its bottom edge peeks out, and resting the pointer on the stack deals the rows
     back out. This is sonner's signature interaction, and it is why the newest row must carry the
     highest z-index - the fold happens in DOM order, but the cover has to be the newest. */
  .toast + .toast { margin-top: -34px; }
  #toasts:hover .toast + .toast, #toasts:focus-within .toast + .toast { margin-top: 8px; }
  .toast .badge { flex: none; width: 16px; height: 16px; display: grid; place-items: center; font-size: 13px; font-weight: 700; line-height: 1; margin-top: 1px; }
  .toast .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .toast.info { background: var(--toast-info-bg); border-color: var(--accent-line); color: var(--accent); }
  .toast.ok { background: var(--toast-ok-bg); border-color: rgba(95, 208, 138, .4); color: var(--ok); }
  .toast.bad { background: var(--toast-bad-bg); border-color: rgba(232, 115, 106, .4); color: var(--bad); }
  .toast.leaving { animation: toast-out .4s ease-in forwards; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(-16px); } }
  .tip { position: fixed; width: 280px; background: var(--surface); border: 1px solid var(--accent); border-radius: 6px; padding: 8px 10px; color: var(--text-body); font-size: 12px; line-height: 1.55; z-index: 60; pointer-events: none; }
  .theme-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 1px solid var(--line-strong); }
  #themeMenu { position: fixed; top: 40px; right: 128px; width: 172px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 4px; z-index: 70; }
  .theme-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 10px; background: transparent; border: none; border-radius: 5px; color: var(--text-body); font: inherit; font-size: 12.5px; font-weight: 400; cursor: pointer; text-align: left; }
  .theme-item:hover { background: var(--surface-2); }
  .theme-item .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .theme-item .name { flex: 1; }
  .theme-item .check { color: var(--accent); }
  .theme-item.custom .dot { border: 1px dashed var(--muted); }
  .swatches { display: inline-flex; gap: 8px; align-items: center; }
  .swatch { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .swatch.active { border-color: #fff; }
</style>
</head>
<body>
<header class="titlebar">
  <!-- The mark from scripts/make-tray-icon.mjs redrawn as SVG: the renderer on some machines fails to
       decode <img> PNGs entirely, and a vector needs no image decoder at all. -->
  <svg class="tb-icon" viewBox="0 0 32 32" width="16" height="16" aria-hidden="true">
    <!-- 六边形环（evenodd 挖空）+ 金色核心，同 scripts/make-tray-icon.mjs 的构图 -->
    <path fill="var(--accent)" fill-rule="evenodd" d="M28.79 23.39 16 30.77 3.21 23.39 3.21 8.61 16 1.23 28.79 8.61ZM24.2 20.74 16 25.47 7.8 20.74 7.8 11.26 16 6.53 24.2 11.26Z"/>
    <path fill="var(--gold)" d="M20.2 18.43 16 20.85 11.8 18.43 11.8 13.58 16 11.15 20.2 13.58Z"/>
  </svg>
  <span class="tb-title">LeagueHextech</span>
  <span class="tb-spacer"></span>
  <span class="tb-version" id="topVersion"></span>
  <button id="diagnose" class="tool" type="button" data-busy="spin" title="重新检测 League Client 连接"><span class="glyph">⟳</span></button>
  <button id="checkUpdate" class="tool" type="button" data-busy="dip" title="检查是否有新版本"><span class="glyph">⇩</span></button>
  <span class="tb-sep"></span>
  <button id="themeBtn" class="tool" type="button" title="主题配色">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a9 9 0 1 0 .5 18c1.6 0 2.3-1 2.3-2 0-.9-.7-1.4-.7-2.2 0-1 .9-1.8 2.1-1.8h1.3A4.5 4.5 0 0 0 22 10.6C21.7 6.3 17.3 3 12 3Z"/>
      <circle cx="7.6" cy="10.6" r="1.15" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="7.4" r="1.15" fill="currentColor" stroke="none"/>
      <circle cx="16.4" cy="10.6" r="1.15" fill="currentColor" stroke="none"/>
    </svg>
  </button>

</header>

<div class="app">
<main>

<div class="top">

</div>

<aside>

    <span class="o">进入房间 <span class="n" id="statJoined">0</span></span>
    <span class="w">放弃 <span class="n" id="statAbandoned">0</span></span>
    <span>跳过 <span class="n" id="statSkipped">0</span></span>
    <span class="b">失败 <span class="n" id="statErrors">0</span></span>
  </div>
  <div id="log" aria-live="polite"></div>

<script type="module">
// Short labels: they are used both as the big state line and as the badge on each log line, so every
// word here is paid for twice.
const LABELS = {
  idle: "空闲", connecting: "连接客户端", searching: "搜索房间", joining: "加入房间",
  verifying: "核对房间", joined: "守候房间中", stopped: "已停止", left: "已离开房间", leaving: "离开房间中",
  watching: "人数变化", "no-match": "无可用房间", skipped: "跳过房间",
  "rejected-after-join": "验证失败退出", error: "请求失败", warning: "提示", configured: "设置已保存",
  "sweep-exhausted": "本轮结束", "room-gone": "房间已消失",
  "left-stale-room": "邀请额度用尽退出", "left-stalled-room": "人数不达标退出",
  "diagnostics-ok": "连接正常", "client-status": "客户端状态", update: "更新"
};
// Tone drives the colour of the left rule and the badge: accent = an action in progress (cyan),
// info = routine scanning (neutral), ok = progress worth seeing, warn = a room given up on, bad = a failure.
const TONES = {
  connecting: "accent", searching: "info", joining: "accent", verifying: "accent",
  joined: "ok", watching: "ok", "diagnostics-ok": "ok",
  skipped: "warn", "rejected-after-join": "warn", "left-stale-room": "warn",
  "left-stalled-room": "warn", "room-gone": "warn", warning: "warn",
  error: "bad", leaving: "accent",
  idle: "muted", stopped: "muted", left: "muted", configured: "muted",
  "no-match": "muted", "sweep-exhausted": "muted", "client-status": "muted"
};
const SOURCES = {
  "client-log": "客户端日志", lockfile: "lockfile", "process-command-line": "进程命令行"
};

/** Waiting in a room that is under the floor is a caution, not a success, even though the state is "joined". */
function toneFor(event) {
  if (event.belowFloor && (event.type === "watching" || event.type === "joined")) return "warn";
  if (event.type === "update") {
    if (event.status === "error") return "bad";
    if (event.status === "ready") return "ok";
    if (event.status === "uptodate") return "muted";
    return "accent";
  }
  return TONES[event.type] ?? TONES[event.state] ?? "info";
}

/** One line for the update row; an empty string hides the row entirely. */
function updateSummary(state) {
  switch (state?.status) {
    case "checking": return "正在检查更新…";
    case "available": return `发现新版本 v${state.version}，开始下载…`;
    case "downloading": return `正在下载 v${state.version ?? ""} ${state.percent ?? 0}%`;
    case "ready": return `v${state.version} 已下载，重启即可完成更新`;
    case "error": return `更新检查失败：${state.message ?? "未知错误"}`;
    case "uptodate": return `已是最新版本（v${state.currentVersion ?? ""}）`;
    default: return "";
  }
}

// A notice is one sentence with an icon, at the top centre of the window. This follows sonner, the
// toast library CC Switch uses: there is no progress bar, no repeat counter and no expandable
// history. A row appears, is read, and leaves. Anything that would need a counter is a message that
// should have been worded once, and anything that would need an expand arrow belongs in the log.
//
// Multiple rows fold like a deck - every row but the newest hides behind the one in front, only its
// bottom edge peeking out, and resting the pointer on the stack deals the rows back out. That fold
// is CSS (`.toast + .toast`); the JS only has to keep the newest row winning the paint order.
//
// The only two knobs are how long a row stays and whether it stays at all. The lifetime is CC
// Switch's own: its Toaster passes duration: 2000 for every kind, and resting the pointer on the
// stack pauses every clock. `sticky` hands the lifetime to the caller instead, for a row that
// reports an ongoing job (a download in flight, an update waiting for an answer) that must not
// vanish while it is still true.
const TOAST_LIFETIME_MS = { info: 2000, ok: 2000, bad: 2000 };
let toastSerial = 0; // monotonic, so the newest row always has the highest z-index

function dismissToast(item, immediate) {
  if (item.dataset.gone) return;
  item.dataset.gone = "1";
  clearTimeout(Number(item.dataset.timer));
  if (immediate) { item.remove(); return; }
  item.classList.add("leaving");
  // Matches the toast-out animation so the node is not yanked out mid-fade.
  setTimeout(() => item.remove(), 400);
}

function restartToastTimer(item, kind) {
  clearTimeout(Number(item.dataset.timer));
  // A sticky row reports an ongoing job; its lifetime belongs to the caller and no hover may hand
  // it a countdown it never had.
  if (item.dataset.sticky) return;
  const life = TOAST_LIFETIME_MS[kind] ?? TOAST_LIFETIME_MS.info;
  item.dataset.timer = String(setTimeout(() => dismissToast(item, false), life));
}

// The pointer resting anywhere on the stack pauses every row's clock, and leaving resumes them all.
// The fold makes this the only sane granularity: the hover that expands the deck is also the hover
// that reads it, and rows vanishing underneath the reader would fold the deck mid-sentence.
function pauseToastTimers() {
  for (const row of $("toasts").children) clearTimeout(Number(row.dataset.timer));
}
function resumeToastTimers() {
  for (const row of $("toasts").children) restartToastTimer(row, row.dataset.kind ?? "info");
}

/** @returns {{dismiss: (immediate?: boolean) => void}} a handle so a sticky row can be closed early. */
function toast(message, kind = "info", { sticky = false } = {}) {
  const text = String(message);
  const item = document.createElement("div");
  item.className = `toast ${kind}`;
  item.dataset.kind = kind;
  if (sticky) item.dataset.sticky = "1";
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = kind === "ok" ? "✓" : kind === "bad" ? "!" : "i";
  const label = document.createElement("span");
  label.className = "text";
  label.textContent = text;
  item.append(badge, label);
  item.onclick = () => dismissToast(item, false);
  // Newest on top of the stack, literally: the fold hides every older row behind the newest one, so
  // the newest has to win the paint order or the fold would cover the wrong card.
  item.style.zIndex = String(toastSerial += 1);
  // Newest first, and never more than a few rows: a notice stack taller than the window is a log.
  $("toasts").prepend(item);
  const rows = $("toasts").children;
  while (rows.length > 3) dismissToast(rows[rows.length - 1], true);
  if (!sticky) restartToastTimer(item, kind);
  return { dismiss: (immediate) => dismissToast(item, immediate) };
}

// An automatic check that found a new version routes its question here: the row offers the answer
// buttons instead of the app downloading on its own. `notice` values come from the main process:
// prompt = ask, silent = a background check with nothing to say, download = a manual check that
// already started downloading.
let promptedUpdateVersion = "";

function renderUpdate(state) {
  const silent = state?.notice === "silent";
  const prompt = state?.notice === "prompt";
  const sticky = state?.status === "downloading" || state?.status === "ready";
  $("updateRow").hidden = !sticky;
  $("updateText").textContent = sticky ? updateSummary(state) : "";
  $("installUpdate").hidden = state?.status !== "ready";
  $("updatePromptRow").hidden = !prompt;
  // Guarded because this text goes straight to the user: an update state that arrives without a
  // version would otherwise render as "发现新版本 vundefined，是否更新？".
  const promptVersion = state?.version ?? "";
  $("updatePromptText").textContent = prompt && promptVersion ? `发现新版本 v${promptVersion}，是否更新？` : "";
  promptedUpdateVersion = prompt ? String(promptVersion) : promptedUpdateVersion;
  if (!silent) {
    // "checking" is not an outcome: the button that started the check already shows a "正在检查更新…"
    // notice, and letting the state render its own row here produced the same sentence twice.
    if (state?.status === "checking") return;
    if (state?.status === "uptodate") toast(`已是最新版本（v${state.currentVersion ?? ""}）`, "ok");
    if (state?.status === "available" && state?.notice === "download") toast(`发现新版本 v${state.version}，开始下载…`);
    if (state?.status === "error") toast(`更新检查失败：${state.message ?? "未知错误"}`, "bad");
  }
  if (state?.currentVersion) setVersionLabels(state.currentVersion);
}

const $ = (id) => document.getElementById(id);
const state = $("state"), log = $("log"), logCount = $("logCount"), clearLogButton = $("clearLog");
const startButton = $("start"), stopButton = $("stop"), leaveButton = $("leave"), restartButton = $("restart");
const clientPill = $("client"), clientText = $("clientText");

// A search runs for hours, so the log is a bounded buffer: appending forever would grow the DOM
// without limit. Consecutive identical lines (a poll every couple of seconds) collapse into one
// with a repeat counter.
const LOG_LIMIT = 200;
const logLines = [];
let lastKey = "";
let repeats = 0;
let lastLobby;
let lastStatus;

/** `HH:mm:ss.SSS`: two events inside the same second are common, and the milliseconds disambiguate. */
function stamp(date = new Date()) {
  const pad = (value, width = 2) => String(value).padStart(width, "0");
  return `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}.${pad(date.getMilliseconds(), 3)}`;
}

function time(value) { return value ? stamp(new Date(value)) : "—"; }

/** A room id is a 36-character uuid; the log shows a short handle and keeps the full id in the tooltip. */
function roomChip(id) {
  const chip = document.createElement("span");
  chip.className = "chip room";
  chip.textContent = String(id).slice(0, 8);
  chip.title = String(id);
  return chip;
}

function textChip(value, kind, title) {
  const chip = document.createElement("span");
  chip.className = `chip${kind ? ` ${kind}` : ""}`;
  chip.textContent = value;
  if (title) chip.title = title;
  return chip;
}

/** The structured part of an event, rendered as chips so the sentence itself stays short. */
function chipsFor(event) {
  const chips = [];
  const lobby = event.lobby;
  if (lobby?.id) chips.push(roomChip(lobby.id));
  if (lobby?.playerCount !== undefined) {
    const max = lobby.maxHumanPlayers ?? 10;
    chips.push(textChip(`${lobby.playerCount}/${max} 人`, "count"));
  }
  if (lobby?.inviteCount !== undefined) chips.push(textChip(`邀请 ${lobby.inviteCount}`, "invite"));
  if (lobby?.spectatorsAllowed === true) {
    chips.push(textChip(`观战 ${lobby.spectatorCount ?? 0}/${lobby.maxSpectators ?? "?"}`, "spectate"));
  }
  if (event.count !== undefined && !lobby) chips.push(textChip(`${event.count} 个房间`, "count"));
  if (event.retryInMs) chips.push(textChip(`${Math.round(event.retryInMs / 1000)}s 后重试`));
  // How long the client took over an operation it answered anyway - a leave that takes ten seconds is
  // the client's doing, and showing the number is what stops it looking like the tool hanging.
  if (event.elapsedMs) chips.push(textChip(`耗时 ${(event.elapsedMs / 1000).toFixed(1)}s`));
  return chips;
}

/**
 * While the tool is deliberately waiting in a room below the floor, the row says so and shows the exact
 * moment it will give up - otherwise a deliberate wait is indistinguishable from being stuck.
 */
function floorChips(status) {
  if (!status?.belowFloor) return [];
  const chips = [textChip(`低于下限 ${status.minPlayers}`, "floor")];
  if (status.watchDeadlineAt) chips.push(textChip(`最晚 ${time(status.watchDeadlineAt)} 退出`, "deadline"));
  else chips.push(textChip("不等待，立即退出", "deadline"));
  return chips;
}

// A probe can be triggered from the button, from the automatic sweep, or by a room action hitting a
// dropped connection - they can overlap, and the light must not stop pulsing until the last one is
// done. Hence a counter rather than a boolean.
let activeProbes = 0;

function beginProbe() {
  activeProbes += 1;
  clientPill.classList.add("probing");
  // The verdict from last time is no longer known to be true, so it is dropped rather than left on
  // screen: pulse-while-green claimed a state the probe was in the middle of re-checking.
  delete clientPill.dataset.state;
  return activeProbes;
}

function endProbe(token) {
  // Guarded so a probe that started later keeps the pulse alive when an earlier one finishes.
  if (token !== activeProbes) return;
  activeProbes = 0;
  clientPill.classList.remove("probing");
}

/** The connection light is the slowest thing on screen and an outlier: it is dimmed in and given a
    5-second grace period before its first real reading, so probing does not flash red at startup. */
let clientStatusGraceUntil = Date.now() + 5000;
let clientStatusTimer;

function scheduleClientStatus() {
  clearTimeout(clientStatusTimer);
  clientStatusTimer = setTimeout(() => renderClientStatus(null), clientStatusGraceUntil - Date.now() + 20);
}

function renderClientStatus(status, { flash = false } = {}) {
  if (!status?.checkedAt) {
    // Grace period: we have not finished the first probe yet, so claim nothing rather than the
    // alarming "no client". The label reads as "still working on it", which is the truth.
    if (Date.now() < clientStatusGraceUntil) {
      clientPill.classList.add("probing");
      clientPill.dataset.state = "busy";
      clientText.textContent = "检测中…";
      scheduleClientStatus();
      return;
    }
    clientPill.classList.remove("probing");
    clientPill.dataset.state = "off";
    clientText.textContent = "未检测到客户端";
    clientPill.title = "请先启动英雄联盟客户端并登录到大厅，然后点「检测客户端」";
    return;
  }
  clientPill.classList.remove("probing");
  clearTimeout(clientStatusTimer); // a real reading ends the grace period, whatever is left of it
  clientStatusGraceUntil = 0;
  if (flash) {
    // Restart the ring animation on every verdict, including two identical ones in a row.
    clientPill.classList.remove("flash");
    void clientPill.offsetWidth;
    clientPill.classList.add("flash");
  }
  if (status.connected) {
    clientPill.dataset.state = "on";
    clientText.textContent = "已连接客户端";
    clientPill.title = `来源：${SOURCES[status.source] ?? status.source}${status.port ? `，端口 ${status.port}` : ""}${status.detail ? `\n${status.detail}` : ""}`;
    return;
  }
  // A client that is running but whose parameters cannot be read is a different problem from a client
  // that is not running at all, and the fix is different too, so the two are not shown the same way.
  if (status.hasClient) {
    clientPill.dataset.state = "warn";
    clientText.textContent = "客户端在线，参数读取失败";
    clientPill.title = `${status.message ?? ""}\n${(status.attempts ?? []).join("\n")}`;
    return;
  }
  clientPill.dataset.state = "off";
  clientText.textContent = "未检测到客户端";
  clientPill.title = status.message ?? "请先启动并登录 League Client";
}

function renderSelection(lobby, status) {
  const row = $("selectionRow");
  const chips = [...chipsFor({ lobby }), ...floorChips(status)];
  if (!lobby?.id && chips.length === 0) {
    row.hidden = true;
    return;
  }
  row.hidden = false;
  $("selection").replaceChildren(...chips);
}

function render(status) {
  if (!status?.state) return;
  lastStatus = status;
  state.dataset.state = status.state;
  state.textContent = LABELS[status.state] ?? status.state;
  // The room row only makes sense while the tool is actually inside a room.
  if (!["joining", "verifying", "joined"].includes(status.state)) lastLobby = undefined;
  else if (status.lobby) lastLobby = status.lobby;
  renderSelection(lastLobby, status);

  $("refreshed").textContent = time(status.lastRefreshAt);
  $("sweeps").textContent = String(status.sweepCount ?? 0);

  const errorRow = $("errorRow");
  errorRow.hidden = !status.lastError;
  if (status.lastError) {
    $("error").textContent = status.lastError;
    // 排障细节（安装目录候选、进程 PID…）不铺在界面上，悬停"最近错误"这一行才看得到。
    $("error").title = (status.diagnostics ?? []).join("\n") || "";
    errorRow.title = $("error").title;
  }
  // Diagnostics are troubleshooting detail (paths, pids) - never a toast, it only ever confused buyers.
  startButton.disabled = Boolean(status.running) || status.state === "joined";
  stopButton.disabled = !status.running && status.state !== "joined";
  leaveButton.disabled = status.state !== "joined";
  restartButton.disabled = status.state !== "joined";
}

function refreshLog() {
  logCount.textContent = `${logLines.length} 条`;
}

// The aggregate over the feed. Counted in the renderer because every number is already in the event
// stream. It describes the visible panel: the panel keeps lines across runs, so resetting on a new
// search made the numbers contradict the log right below them. Only clearing the panel zeroes it.
const counters = { attempts: 0, joined: 0, abandoned: 0, skipped: 0, errors: 0 };
const COUNTER_IDS = {
  attempts: "statAttempts", joined: "statJoined", abandoned: "statAbandoned",
  skipped: "statSkipped", errors: "statErrors"
};

function countEvent(event) {
  switch (event.type) {
    case "joining": counters.attempts += 1; break;
    case "joined": counters.joined += 1; break;
    case "left-stale-room":
    case "left-stalled-room": counters.abandoned += 1; break;
    case "skipped":
    case "rejected-after-join": counters.skipped += 1; break;
    case "error": counters.errors += 1; break;
    default: return;
  }
  for (const [key, id] of Object.entries(COUNTER_IDS)) $(id).textContent = String(counters[key]);
}

// LCU request paths and room summaries carry a full UUID each; the room chips already show 8
// characters with the full value on hover, and the sentence gets the same treatment instead of a
// wall of hex pushing the actual explanation off the line.
const UUID_RE = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi;
const shortenUuids = (text) => text.replace(UUID_RE, (m) => m.slice(0, 8));

function buildLine(event) {
  const line = document.createElement("div");
  line.className = "line";
  line.dataset.tone = toneFor(event);

  const stampEl = document.createElement("span");
  stampEl.className = "t";
  stampEl.textContent = stamp();

  const tag = document.createElement("span");
  tag.className = "tag";
  tag.textContent = LABELS[event.type] ?? LABELS[event.state] ?? event.type;

  line.append(stampEl, tag);

  const message = event.message ?? event.selectedSummary;
  if (message) {
    const text = document.createElement("span");
    text.className = "msg";
    const shown = shortenUuids(String(message));
    text.textContent = shown;
    // Anything that got shortened keeps its full value one hover away.
    if (shown !== String(message)) text.title = String(message);
    line.append(text);
  }
  const chips = [...chipsFor(event), ...floorChips(event)];
  if (chips.length) {
    const holder = document.createElement("span");
    holder.className = "chips";
    holder.append(...chips);
    line.append(holder);
  }
  const repeat = document.createElement("span");
  repeat.className = "x";
  repeat.hidden = true;
  line.append(repeat);
  return line;
}

function append(event) {
  const key = `${LABELS[event.type] ?? event.type}|${event.message ?? ""}|${event.lobby?.id ?? ""}|${event.lobby?.playerCount ?? ""}|${event.lobby?.inviteCount ?? ""}|${event.watchDeadlineAt ?? ""}`;
  // Discrete user actions (saving settings) are never collapsed: a fresh ×N on every click reads like
  // the click fired twice, when the counter was really carrying over from earlier saves.
  const collapsible = event.type !== "configured";
  if (collapsible && key === lastKey && logLines.length > 0) {
    repeats += 1;
    const counter = logLines[logLines.length - 1].querySelector(".x");
    counter.hidden = false;
    counter.textContent = `×${repeats + 1}`;
    return;
  }
  repeats = 0;
  lastKey = key;
  // The panel reads like a console: newest at the bottom, view following it. The notice stack sits
  // over the panel's top edge, so a newest-first log would put every fresh line exactly where the
  // toasts land - and following the tail also means the reader never loses their place.
  const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  const line = buildLine(event);
  logLines.push(line);
  log.append(line);
  // The buffer is bounded, so a search that runs all night cannot grow the panel or the DOM.
  if (logLines.length > LOG_LIMIT) logLines.shift().remove();
  if (stick) log.scrollTop = log.scrollHeight;
  refreshLog();
}

clearLogButton.onclick = () => {
  for (const line of logLines) line.remove();
  logLines.length = 0;
  lastKey = "";
  repeats = 0;
  // Clearing the panel clears the aggregate too: the numbers describe what the panel shows.
  for (const key of Object.keys(counters)) counters[key] = 0;
  for (const id of Object.values(COUNTER_IDS)) $(id).textContent = "0";
  refreshLog();
};

// A click has to look like it landed on the first frame, and a click that takes half a second has to
// say so. But a click that answers in 150ms must NOT flash "working" - and above all it must not
// raise a banner at the top of the window, which is what made the old version feel so abrupt: the
// banner had not even finished animating in before the result pushed it aside.
//
// So the button carries the in-flight state itself (`working` class + a spinner), and only work that
// actually takes a while escalates to the notice layer - and it does so *late*, after LOUD_AFTER_MS
// with the call still outstanding, so the banner never appears for a hiccup.
//
// Two shapes of button need two ways of saying "working":
//   - a wide text button (「开始搜索」) swaps its label for the verb phrase and wears a spinner;
//   - a toolbar glyph button (⟳ ⇩) cannot take a phrase without lurching in width, so it spins in
//     place and keeps its glyph.
const BUSY_SETTLE_MS = 160; // hold "working" at least this long once shown, so it reads as deliberate
const LOUD_AFTER_MS = 350; // past this, the wait is long enough to deserve a banner
let spinnerSerial = 0;

function startSpinner(button, text) {
  const token = `s${++spinnerSerial}`;
  button.dataset.spin = token;
  if (button.querySelector(".glyph")) return token; // glyph buttons spin via CSS, nothing to swap
  button.textContent = "";
  const ring = document.createElement("span");
  ring.className = "spin";
  button.append(ring, text);
  return token;
}

async function withButtonBusy(button, busyText, run, { loudText = "" } = {}) {
  if (button.dataset.working) return undefined; // a second click is part of the first, not a second call
  button.dataset.working = "1";
  // Remembered once, before any spinner touches it. Read from the saved copy rather than from the
  // DOM on each call: the DOM text is whatever the last spinner left behind, and that is not a label.
  if (button.dataset.restingLabel === undefined) {
    button.dataset.restingLabel = button.textContent;
    button.dataset.restingTitle = button.title;
  }
  const glyphButton = Boolean(button.querySelector(".glyph"));
  const resting = button.dataset.restingLabel;
  button.disabled = true;
  button.classList.add("working");
  const token = busyText ? startSpinner(button, busyText) : "";
  if (busyText) button.title = busyText;
  const started = Date.now();
  let loud;
  // Escalation is what "loudText" asks for and it is deliberately lazy: for the first LOUD_AFTER_MS a
  // quick call gets no banner, only the spinner on the button that was clicked.
  const escalator = loudText
    ? setTimeout(() => {
        if (button.dataset.spin !== token) return; // already finished; nothing to escalate
        loud = toast(loudText, "info", { sticky: true });
        button.classList.add("busy-loud");
      }, LOUD_AFTER_MS)
    : undefined;
  try {
    return await run();
  } catch (error) {
    append({ type: "error", message: error?.message ?? String(error) });
    return undefined;
  } finally {
    clearTimeout(escalator);
    if (loud) loud.dismiss(true);
    // A call that answered instantly must not flash the spinner; holding it briefly keeps the
    // sequence reading as "pressed -> working -> done" instead of a stutter.
    const shownFor = Date.now() - started;
    if (busyText && button.dataset.spin === token) {
      if (shownFor < BUSY_SETTLE_MS) await new Promise((resolve) => setTimeout(resolve, BUSY_SETTLE_MS - shownFor));
      // A glyph button never lost its markup, so there is nothing to put back.
      if (!glyphButton && button.dataset.spin === token) button.textContent = resting;
    }
    button.dataset.spin = "";
    button.title = button.dataset.restingTitle ?? "";
    button.classList.remove("working", "busy-loud");
    delete button.dataset.working;
    button.disabled = false;
  }
}

startButton.onclick = async () => {
  const status = await withButtonBusy(startButton, "正在启动搜索…", () => window.searcher.start(), { loudText: "正在启动搜索…" });
  if (status) render(status);
};

leaveButton.onclick = () => withButtonBusy(leaveButton, "正在离开房间…", async () => render(await window.searcher.leave()), { loudText: "正在离开房间…" });

// Probing the client is the fastest thing in the app - it usually lands in well under 200ms. It says
// so on the button and on the connection light, and then answers in a banner: the pill can only show
// a colour, whereas the verdict also needs to name the source and the port it was found on.
// The pulse starts synchronously with the click so the very first frame already reads as "working".
$("diagnose").onclick = () => {
  const probe = beginProbe();
  return withButtonBusy($("diagnose"), "正在检测…", async () => {
    try {
      const result = await window.searcher.diagnose();
      // Only the human-readable verdict is worth showing; the path candidates and pid list behind it
      // are noise for a normal user - they live in the hover details of the client status pill.
      renderClientStatus({
        checkedAt: Date.now(),
        connected: Boolean(result.ok),
        hasClient: result.hasClient,
        source: result.source,
        port: result.port,
        message: result.message,
        attempts: result.attempts,
      }, { flash: true });
      // The row wraps rather than truncating, so the whole sentence fits and there is nothing to
      // shorten. It is the same copy the pill's tooltip carries.
      const where = result.ok && result.source ? `（来源 ${SOURCES[result.source] ?? result.source}${result.port ? `，端口 ${result.port}` : ""}）` : "";
      toast(result.ok ? `已连接 League Client${where}` : result.message ?? "未检测到客户端", result.ok ? "ok" : "bad");
    } finally {
      endProbe(probe);
    }
  });
};

$("checkUpdate").onclick = async () => {
  // The one button that genuinely takes a while: a GitHub round trip. It gets the spinner like the
  // rest, and because the wait outlasts LOUD_AFTER_MS it also earns a banner saying what is happening -
  // that banner arriving late is exactly what makes it feel natural rather than abrupt.
  const status = await withButtonBusy($("checkUpdate"), "正在检查更新…", () => window.searcher.checkUpdate(), { loudText: "正在检查更新…" });
  if (status) renderUpdate(status, { immediate: true });
};

// The about dialog reads the live version from the updater state; the channel is derived from the
// version shape, the same rule the updater itself uses to pick its feed file.
// The settings dialog follows the LeagueAkari layout: a button in the corner opens a dialog with
// a settings page and an about page, instead of the dialog living inline in the main column.
// One themed tooltip for every "?" instead of the OS-styled native title box.
function setVersionLabels(version) {
  version = version ?? "";
  $("topVersion").textContent = version ? `v${version}` : "";
}

let tipNode;
function showTip(target) {
  tipNode ??= (() => {
    const el = document.createElement("div");
    el.className = "tip";
    el.hidden = true;
    document.body?.append(el);
    return el;
  })();
  tipNode.textContent = target.dataset.tip;
  tipNode.hidden = false;
  const box = target.getBoundingClientRect?.();
  if (box && typeof window !== "undefined" && window.innerWidth) {
    tipNode.style.left = `${Math.max(8, Math.min(box.left, window.innerWidth - 292))}px`;
    tipNode.style.top = `${box.bottom + 6}px`;
  }
}
function hideTip() { if (tipNode) tipNode.hidden = true; }
document.addEventListener?.("mouseover", (event) => {
  const help = event.target?.closest?.(".help");
  if (help) showTip(help);
});
document.addEventListener?.("mouseout", (event) => {
  if (event.target?.closest?.(".help")) hideTip();
});

function hexRgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, alpha) {
  const [r, g, b] = hexRgb(hex);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}
function applyTheme(themeId, customAccent) {
  const theme = THEMES[themeId] ?? THEMES.dark;
  const accent = themeId === "custom" && /^#[0-9a-f]{6}$/i.test(customAccent ?? "")
    ? customAccent
    : theme.accent;
  const root = document.documentElement;
  const vars = {
    ...theme.vars,
    "--accent": accent,
    "--accent-dim": rgba(accent, .16),
    "--accent-line": rgba(accent, .5),
    "--accent-contrast": theme.contrast
  };
  for (const [name, value] of Object.entries(vars)) root.style?.setProperty?.(name, value);
  for (const item of document.querySelectorAll?.(".theme-item") ?? []) {
    const check = item.querySelector?.(".check");
    if (check) check.hidden = item.dataset.theme !== themeId;
  }
}
async function saveTheme(themeId) {
  const saved = await window.searcher.updateSettings({ themeId, accentColor: THEMES[themeId]?.accent }).catch(() => undefined);
  applyTheme(themeId, saved?.accentColor);
  themeMenu.hidden = true;
}
const themeMenu = $("themeMenu");
for (const [id, theme] of Object.entries(THEMES)) {
  const item = document.createElement("button");
  item.type = "button";
  item.className = "theme-item";
  item.dataset.theme = id;
  const dot = document.createElement("span");
  dot.className = "dot";
  dot.style.background = theme.accent;
  const label = document.createElement("span");
  label.className = "name";
  label.textContent = theme.name;
  const check = document.createElement("span");
  check.className = "check";
  check.textContent = "✓";
  item.append(dot, label, check);
  item.onclick = () => saveTheme(id);
  themeMenu.append(item);
}
// A free picker for highlight colours outside the presets: the charcoal base stays, only the accent
// follows the picked colour. The OS colour dialog is opened through a hidden input.
const accentCustom = document.createElement("button");
accentCustom.type = "button";

accentCustom.dataset.theme = "custom";

customName.textContent = "自定义强调色…";

  const hex = event.target.value;

  applyTheme("custom", saved?.accentColor ?? hex);

$("winMin").onclick = () => window.searcher.winMinimize?.();
$("winMax").onclick = () => window.searcher.winMaximize?.();

$("installUpdate").onclick = async () => {
  // The app exits here; the installer takes over.
  await window.searcher.installUpdate();
};

// The three answers to "发现新版本，是否更新？". Accepting hands over to the persistent download
// row; skipping records the version so automatic checks stop asking about exactly this one.
$("downloadUpdate").onclick = async () => {
  $("updatePromptRow").hidden = true;
  await window.searcher.downloadUpdate();
};
$("skipUpdate").onclick = async () => {
  const version = promptedUpdateVersion;
  renderUpdate(await window.searcher.skipUpdateVersion(version));
  toast(`已跳过 v${version}，之后不再自动提醒这个版本`, "ok");
};
$("laterUpdate").onclick = () => {
  $("updatePromptRow").hidden = true;
};

// A double click would write two identical "saved" lines (shown as ×2), which reads like something
// went wrong; a short guard treats the second click as part of the first save.
let saveInFlight = false;
$("save").onclick = async () => {
  if (saveInFlight) return;
  saveInFlight = true;
  try {
    const saved = await window.searcher.updateSettings({
      pollIntervalMs: Number($("pollIntervalMs").value),
      minPlayers: Number($("minPlayers").value),
      maxInvites: Number($("maxInvites").value),
      nameKeywords: $("nameKeywords").value,
      stallTimeoutMs: Number($("stallTimeoutSec").value) * 1000
    });
    applySettings(saved);
    // "设置已保存" comes back through the controller's own configured event; appending here too is
    // what made one save show up twice.
  } finally {
    setTimeout(() => { saveInFlight = false; }, 800);
  }
};

function applySettings(settings) {
  for (const key of ["pollIntervalMs", "minPlayers", "maxInvites"]) $(key).value = settings[key];
  $("nameKeywords").value = (settings.nameKeywords ?? []).join(",");
  // Stored in milliseconds, shown in seconds so the field stays readable.
  $("stallTimeoutSec").value = Math.round((settings.stallTimeoutMs ?? 0) / 1000);
  // The summary carries the settings that actually change behaviour, so the panel can stay closed.
  const stall = Math.round((settings.stallTimeoutMs ?? 0) / 1000);
  $("settingsNow").textContent = `人数下限 ${settings.minPlayers} · 邀请上限 ${settings.maxInvites} · 低于下限${stall === 0 ? "不等待" : `等 ${stall}s`}`;
  applyTheme(settings.themeId, settings.accentColor);
}

window.searcher.onEvent((event) => {
  countEvent(event);
  if (event.type === "update") {
    renderUpdate(event);
    // Only outcomes earn a log line: a downloaded update, "already current" after a manual check,
    // or a failure. "checking", download ticks and "available" (covered by the ask row or the
    // download toast) are transient - logging the start is what made one check show up twice.
    // A "silent" event is a background check with nothing to say: no toast, no log line at all.
    const outcome = event.status === "ready" || event.status === "uptodate" || event.status === "error";
    if (outcome && event.notice !== "silent") append(event);
    return;
  }
  if (event.type === "client-status") {
    renderClientStatus(event);
    return;
  }
  // A fatal request failure means the client is gone, so the indicator stops claiming otherwise
  // instead of waiting for the next scheduled check.
  if (event.type === "error" && event.fatal) {
    clientPill.dataset.state = "off";
    clientText.textContent = "连接中断";
  }
  if (event.lobby) lastLobby = event.lobby;
  render(event);
  append(event);
});

// The narrow buttons (「停止」 is two characters) cannot spell their verb phrase in place, so the hover
// title carries it. Set from the markup, before any spinner ever runs.
$("stop").title = "正在停止";
$("restart").title = "离开当前房间并立即重新搜索";

// enter/leave do not bubble, but they do fire on ancestors of the hit-tested child, so these see the
// pointer even though the container itself is pointer-events:none.
$("toasts").onmouseenter = pauseToastTimers;
$("toasts").onmouseleave = resumeToastTimers;

renderClientStatus(await window.searcher.clientStatus());
renderUpdate(await window.searcher.updateStatus());
applySettings(await window.searcher.getSettings());
render(await window.searcher.status());
</script>
