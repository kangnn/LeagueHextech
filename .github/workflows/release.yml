name: release

# Two update channels:
#   * every push to master  -> a dev prerelease (`ci-<sha>`) whose version is `<base>-ci.g<sha>`;
#     it carries the installer, its blockmap and a `ci.yml` feed, so an installed dev build updates
#     itself along dev commits (only the three newest dev prereleases are kept)
#   * every `v*` tag        -> a stable release carrying the installer, its blockmap, `latest.yml`,
#     a `ci.yml` copy and the portable zip
# `latest.yml` only ever lands on a stable release, so stable installs never see prereleases; a dev
# build reads `ci.yml` instead, which is what lets the two channels update independently.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

# One build per ref at a time, and never cancel one midway: a cancelled run can leave a release with half
# its assets uploaded.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The default token is read-only on newer repositories; publishing a release needs write.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A broken commit must never reach a download link.
      - name: Test
        run: npm test

      # The tray icon and the exe icon are generated code that is committed. Regenerating them proves the
      # committed copies are exactly what the generator produces, instead of drifting silently.
      - name: Verify the generated icons are current
        run: |
          node scripts/make-tray-icon.mjs
          git diff --exit-code src/tray-icon.mjs pictures/icon.ico

      # A tag that disagrees with package.json would produce an installer and a latest.yml that claim a
      # different version than the release it is attached to, which breaks the updater for everyone.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "v" + (node -p "require('./package.json').version")
          if ($version -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} does not match package.json ($version)"
          }

      # A dev build gets a version of its own: the sha makes every dev build distinct, and the `-ci.`
      # prerelease tag puts it on the dev channel - an installed dev build looks for a `ci.yml` feed
      # instead of the stable `latest.yml`.
      - name: Set the dev channel version
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version.split('-')[0]")-ci.g${GITHUB_SHA::7}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$version';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "Dev version: $version"

      # electron-builder: NSIS installer + resources/app-update.yml + latest.yml for the updater.
      - name: Build the installer
        run: npm run build:installer

      # The feed the installed app will poll. Printed so a broken publish config is visible in the log
      # instead of only showing up as an app that never finds an update.
      - name: Show the update feed baked into the app
        shell: pwsh
        run: |
          Get-Content release/win-unpacked/resources/app-update.yml
          Get-Content release/latest.yml

      # The portable folder stays available for people who would rather not install anything; it simply
      # cannot update itself.
      - name: Build the portable app
        run: npm run build:portable

      - name: Package the portable folder as a single archive
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            "$PWD/dist/LeagueHextech",
            "$PWD/dist/league-hextech-win-x64.zip",
            [System.IO.Compression.CompressionLevel]::Optimal,
            $true)
          Get-ChildItem release, dist -Filter *.exe -Recurse | Select-Object Name, Length
          Get-Item release/latest.yml, dist/league-hextech-win-x64.zip | Select-Object Name, Length

      - name: Publish a stable release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          # The .blockmap is what lets electron-updater fetch only the changed blocks instead of the whole
          # installer; without it every update is a full download.
          # A copy of latest.yml as ci.yml gives the dev channel a feed that points at the stable release,
          # so a dev build converges onto stable instead of erroring on a missing channel file.
          Copy-Item release/latest.yml release/ci.yml
          gh release create $tag `
            (Get-Item release/*.exe).FullName `
            (Get-Item release/*.exe.blockmap).FullName `
            "release/latest.yml" `
            "release/ci.yml" `
            "dist/league-hextech-win-x64.zip" `
            --title "LeagueHextech $tag" `
            --latest `
            --generate-notes
          # GitHub already lists each asset's digest, but an unsigned build needs the user to be able to
          # check it themselves - so the notes carry the values and the command.
          $lines = @("", "## 文件校验值（SHA-256）", "")
          foreach ($file in @((Get-Item release/*.exe), (Get-Item dist/league-hextech-win-x64.zip))) {
            $lines += "- $($file.Name)：$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower())"
          }
          $lines += ""
          $lines += "校验方法：certutil -hashfile 文件名 SHA256"
          $body = (gh release view $tag --json body | ConvertFrom-Json).body
          gh release edit $tag --notes ($body + ($lines -join "`n"))
          "Published: https://github.com/${{ github.repository }}/releases/tag/$tag"

      - name: Publish a dev prerelease
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $tag = "ci-$sha"
          # electron-builder always writes latest.yml (regardless of a prerelease version), so the dev
          # channel feed is that same file under the channel name an installed dev build asks for.
          Copy-Item release/latest.yml release/ci.yml
          # Re-running the same commit must not fail on an existing tag.
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --yes --cleanup-tag }
          gh release create $tag `
            (Get-Item release/*.exe).FullName `
            (Get-Item release/*.exe.blockmap).FullName `
            "release/ci.yml" `
            "dist/league-hextech-win-x64.zip" `
            --target "${{ github.sha }}" `
            --title "LeagueHextech Dev Prerelease #${{ github.run_number }} ($sha)" `
            --prerelease `
            --generate-notes
          "Published: https://github.com/${{ github.repository }}/releases/tag/$tag"

      # Each build adds a ~130 MB asset, so old dev prereleases are trimmed down to three.
      # Only `ci-*` tags are ever touched; stable `v*` releases are left alone. A failure here must not
      # fail the build.
      - name: Keep only the three newest dev prereleases
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $all = gh release list --limit 200 --json tagName,isPrerelease,createdAt | ConvertFrom-Json
          $dev = $all | Where-Object { $_.isPrerelease -and $_.tagName -like 'ci-*' } |
            Sort-Object createdAt -Descending
          if ($dev.Count -gt 3) {
            $dev | Select-Object -Skip 3 | ForEach-Object {
              "Deleting $($_.tagName)"
              gh release delete $_.tagName --yes --cleanup-tag
            }
          } else {
            "Nothing to trim ($($dev.Count) dev prereleases)"
          }

# Cutting a stable release:
#   npm version 0.1.2 --no-git-tag-version   # or edit package.json
#   git commit -am "release: 0.1.2" && git push
#   git tag v0.1.2 && git push origin v0.1.2
# The tag push runs this workflow, which builds the installer, verifies the tag against package.json and
# publishes the release with latest.yml - the file installed copies poll to update themselves.
