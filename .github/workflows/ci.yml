name: tests

# Every push already builds a release artifact, which is the real integration check; these suites
# are kept for manual runs and pull requests instead of doubling the CI load on every commit.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The app only ships for Windows, so that is the platform worth staying green on.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Deliberately no full install step (electron's download would dominate the run); but the
      # websocket suite drives src/lcu-websocket.mjs, which imports the `ws` runtime dependency,
      # so that one package has to be present before the suites can execute.
      - name: Install ws (only runtime dependency the suites need)
        run: npm install ws --no-save --no-audit --no-fund
      - name: Run the test suites
        run: npm test
